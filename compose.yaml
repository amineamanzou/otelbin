name: otelbin

services:
  otelbin:
    image: otelbin-airgapped:local
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        COLLECTOR_RELEASES_URL: ${COLLECTOR_RELEASES_URL:-}
    networks: [closed]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/validation/supported-distributions').then(async r => { if (!r.ok || Object.keys(await r.json()).length === 0) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 5

  gateway:
    image: ${PROXY_IMAGE:-nginxinc/nginx-unprivileged:1.31.1-alpine}
    ports:
      - "127.0.0.1:${OTELBIN_PORT:-3180}:8080"
    networks: [host-access, closed]
    depends_on:
      otelbin:
        condition: service_healthy
        restart: true
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  host-access:
  closed:
    internal: true
